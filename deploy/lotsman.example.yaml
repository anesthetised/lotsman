# Lotsman configuration. Copy to /etc/lotsman/lotsman.yaml.

# Where the AmneziaWG listener binds and what clients connect to.
listen: 0.0.0.0:51820
endpoint: vpn.example.org:51820
# The AmneziaWG generation the listener speaks, for every client: 3 (header
# protection and random trailers; Amnezia client 5.0.1.5 or later) or 2 (older
# clients). Changing it needs a restart and new client configs.
awg: 3

# Addresses handed to clients; .1 is the gateway.
subnet: 10.77.0.0/16
# Resolvers written into client configs. Queries travel through the client's upstream.
dns: [1.1.1.1, 1.0.0.1]

state_dir: /var/lib/lotsman

# Your own provider subscriptions. `conf` is the AmneziaWG config the provider
# generated for you; it must route 0.0.0.0/0. The name becomes the interface
# lm-up-<name>, so keep it to 9 characters. Devices are routed by the two
# required labels: `geo` is the exit's country (ISO 3166-1 alpha-2, capitals),
# `provider` who runs it (lowercase letters, digits, `-`). Users may see upstream
# names even when the operator hides providers from them (lotsman user rights
# -show-providers=false), so name upstreams neutrally if that matters.
upstreams:
  - name: ac-nl
    conf: /etc/lotsman/upstreams/ac-nl.conf
    geo: NL
    provider: acme
  - name: ac-de
    conf: /etc/lotsman/upstreams/ac-de.conf
    geo: DE
    provider: acme
  # An Outline (Shadowsocks) server: `conf` is a file (mode 0600) holding the
  # ss:// access key. TCP and UDP pass, ICMP does not. `max_flows` caps the
  # connections it carries at once (default 4096).
  # - name: ol-fi
  #   kind: outline
  #   conf: /etc/lotsman/upstreams/ol-fi.key
  #   geo: FI
  #   provider: acme
  # A VLESS + REALITY + XTLS Vision server (Xray): `conf` is a file (mode 0600)
  # holding its vless:// share link. Otherwise like an Outline upstream.
  # - name: vl-nl
  #   kind: vless
  #   conf: /etc/lotsman/upstreams/vl-nl.key
  #   geo: NL
  #   provider: beta

# Users, devices and routes are not part of this file: they live in the
# database and apply without a restart. Each device is one client config with
# its own route, which changes on the gateway only. A route lists countries,
# optionally narrowed to providers: in order (the first with a healthy upstream
# wins) or, with -fastest, by latency; without countries, any upstream. With
# -fallback a device whose countries are all down uses any upstream instead of
# being blocked. For the upstreams above:
#   lotsman device add alice/phone                 # the fastest of any upstream
#   lotsman device add alice/laptop NL DE:acme     # NL first, then acme in DE
#   lotsman device route alice/laptop -fastest -fallback NL DE
#   lotsman user rights alice -exits ac-nl         # alice may use ac-nl only

health:
  interval: 15s
  # A TCP port reachable through every AmneziaWG upstream, or a list of them. An
  # upstream is healthy when any target answers, so one blocked destination takes
  # none down.
  probe: 1.1.1.1:443
  # probe: [1.1.1.1:443, 8.8.8.8:443]
  # Resolvers queried over UDP and TCP through every Outline and VLESS upstream;
  # one is healthy when both get an answer from any of them.
  dns: 1.1.1.1:53
  down_after: 3
  up_after: 2
  # Off unless set: catches upstreams that answer probes but freeze or crawl
  # under real traffic. Every interval (±20%) each upstream downloads from url
  # and must get min_bytes within timeout; down_after failures mark it
  # degraded (used only when a route has nothing better), up_after passes
  # clear it; while failing it probes every interval/5. About 18 MiB a day per
  # upstream at these values. The host's resolver looks up the URL's host.
  # transfer:
  #   url: https://speed.cloudflare.com/__down?bytes=65536   # or a list
  #   min_bytes: 65536
  #   timeout: 10s
  #   interval: 5m

# How long the availability and traffic history behind the web panel's charts
# is kept: samples of a minute for minute_retention, then samples of an hour
# until they are hour_retention old. These are the defaults; hours, not days
# ("168h"). Applies on reload.
# history:
#   minute_retention: 168h   # 7 days; at least 1h
#   hour_retention: 2160h    # 90 days; not shorter than minute_retention

# Prometheus endpoint, off unless set. It names users, so keep it on the tunnel
# gateway (reachable by clients only) or on loopback; 0.0.0.0 is refused.
# metrics:
#   listen: 10.77.0.1:9100

# What users may do on their own page in the web panel (lotsman user link).
# max_devices caps the devices a user can have when adding one there; 0 turns
# adding off. The operator's commands are not limited.
# users:
#   max_devices: 5
