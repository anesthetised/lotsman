# Lotsman configuration. Copy to /etc/lotsman/lotsman.yaml.

# Where the AmneziaWG 2.0 listener binds and what clients connect to.
listen: 0.0.0.0:51820
endpoint: vpn.example.org:51820

# Addresses handed to clients; .1 is the gateway.
subnet: 10.77.0.0/16
# Resolvers written into client configs. Queries travel through the client's upstream.
dns: [1.1.1.1, 1.0.0.1]

state_dir: /var/lib/lotsman

# Your own provider subscriptions. `conf` is the AmneziaWG config the provider
# generated for you; it must route 0.0.0.0/0. The name becomes the interface
# lm-up-<name>, so keep it to 9 characters. `geo`, `provider` and `tags` are
# free-form labels that profiles match on.
upstreams:
  - name: rs-lt
    conf: /etc/lotsman/upstreams/rs-lt.conf
    geo: LT
    provider: redshield
    tags: [near, eu]
  - name: rs-nl
    conf: /etc/lotsman/upstreams/rs-nl.conf
    geo: NL
    provider: redshield
    tags: [eu]
  - name: rs-us
    conf: /etc/lotsman/upstreams/rs-us.conf
    geo: US
    provider: redshield

# A user gets one client config per profile. `prefer` is an ordered list of
# tiers; the first tier with a healthy upstream wins, lowest latency within a
# tier. A tier is one match on geo, provider and/or tag. Empty means any upstream.
profiles:
  - name: auto
    prefer: []
  - name: near
    prefer: [{tag: near}]
  - name: eu
    prefer: [{tag: near}, {tag: eu}]
  - name: nl
    prefer: [{geo: NL}, {tag: eu}]
  - name: us
    prefer: [{geo: US}]

health:
  interval: 15s
  probe: 1.1.1.1:443   # a TCP port reachable through every upstream
  down_after: 3
  up_after: 2

# Prometheus endpoint, off unless set. It names users, so keep it on the tunnel
# gateway (reachable by clients only) or on loopback; 0.0.0.0 is refused.
# metrics:
#   listen: 10.77.0.1:9100
