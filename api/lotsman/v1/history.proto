// The lotsman.v1 control API: history (#130).
// See status.proto for where it is served.
syntax = "proto3";

package lotsman.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/anesthetised/lotsman/api/lotsman/v1;lotsmanv1";

service HistoryService {
  rpc Upstream(HistoryRequest) returns (HistoryResponse); // name = upstream
  rpc Peer(HistoryRequest) returns (HistoryResponse); // name = peer_id
}

message HistoryRequest {
  string name = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // The wanted step. The server rounds it up to a multiple of what it keeps
  // for the range (1 min up to 7 d back, else 1 h) and, if needed, further
  // so that at most 2000 samples come back. Unset: the finest kept step.
  google.protobuf.Duration step = 4;
}

message HistoryResponse {
  google.protobuf.Duration step = 1; // the step the server used
  repeated Sample samples = 2;
}

message Sample {
  google.protobuf.Timestamp time = 1;
  float up_ratio = 2; // upstream only: share of the step it was up, 0..1
  google.protobuf.Duration latency = 3;
  uint64 down_bytes = 4;
  uint64 up_bytes = 5;
  // Upstream only: the speed tests in the step, averaged, bytes per second;
  // 0 when none ran.
  uint64 down_rate = 6;
  uint64 up_rate = 7;
}
