// The lotsman.v1 control API: user self-service (#134).
// See status.proto for where it is served.
syntax = "proto3";

package lotsman.v1;

import "google/protobuf/duration.proto";
import "lotsman/v1/history.proto";
import "lotsman/v1/status.proto";
import "lotsman/v1/user.proto";

option go_package = "github.com/anesthetised/lotsman/api/lotsman/v1;lotsmanv1";

// The acting user comes from the `Lotsman-User` request header, which only
// lotsman web sets (after resolving the link) and always strips from browsers.
service UserSelfService {
  rpc ResolveLink(ResolveLinkRequest) returns (ResolveLinkResponse); // panel only
  rpc Get(GetSelfRequest) returns (User);
  // Own devices and the user's allowed exits. Other users show through
  // upstreams, so for those the daemon leaves traffic, routed and active
  // unset, and the snapshot's total covers only the user's own devices.
  // Without rights.show_providers every upstream's provider is empty.
  rpc Watch(WatchStatusRequest) returns (stream StatusSnapshot);
  // max_devices, rate limit. Without rights.edit_routes the route must be
  // unset (PermissionDenied otherwise) and the device gets the default one.
  rpc AddDevice(AddSelfDeviceRequest) returns (DeviceConfig);
  // PermissionDenied without rights.edit_routes; a route naming providers is
  // InvalidArgument without rights.show_providers.
  rpc SetRoute(SetSelfRouteRequest) returns (Device);
  rpc RemoveDevice(RemoveSelfDeviceRequest) returns (RemoveDeviceResponse);
  rpc GetConfig(GetConfigRequest) returns (DeviceConfig); // own devices only
  // History of one of the user's allowed exits: up_ratio and latency only,
  // no bytes. Any other upstream is NotFound.
  rpc UpstreamHistory(HistoryRequest) returns (HistoryResponse);
  // History of one of the user's own devices (name = peer_id). Any other
  // peer is NotFound.
  rpc PeerHistory(HistoryRequest) returns (HistoryResponse);
}

message ResolveLinkRequest {
  string token = 1;
}
message ResolveLinkResponse {
  string user = 1;
}
message GetSelfRequest {}
message AddSelfDeviceRequest {
  string device = 1;
  Route route = 2; // unset: the fastest of any allowed exit
}
message SetSelfRouteRequest {
  string device = 1;
  Route route = 2;
}
message RemoveSelfDeviceRequest {
  string device = 1;
}

// The detail of a resource_exhausted AddDevice: which limit refused it.
message SelfServiceLimit {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_MAX_DEVICES = 1; // the user has max_devices devices already
    REASON_RATE_LIMITED = 2; // too many additions lately
  }
  Reason reason = 1;
  uint32 max_devices = 2; // with REASON_MAX_DEVICES
  google.protobuf.Duration retry_after = 3; // with REASON_RATE_LIMITED: until the next addition is allowed
}
