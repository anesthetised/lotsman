# Plugins run through `go tool`, pinned in go.mod to the runtime versions.
# The TypeScript client (protoc-gen-es) goes here too, with its own out.
version: v2
inputs:
  - directory: api
plugins:
  - local: [go, tool, protoc-gen-go]
    out: api
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: api
    opt: paths=source_relative
