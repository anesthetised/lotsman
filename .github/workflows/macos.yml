name: macOS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # just lint builds buf from tools/go.mod.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: extractions/setup-just@v2
      - run: just lint
      - run: go test -race ./...
