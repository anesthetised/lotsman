name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # just lint builds buf from tools/go.mod.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: extractions/setup-just@v2
      - run: just lint
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v2
      # The full suite in the privileged test image, every package serially: the same
      # entry point as a local `just test-integration`. -v keeps each case in the log.
      - run: just test-integration -v ./...
      # The end-to-end tests once more on the runner's own network namespace.
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: go test -c -tags integration -o /tmp/e2e.test ./cmd/lotsman
      - run: sudo /tmp/e2e.test -test.v -test.run 'TestEndToEnd|TestFirewallFlushRepaired'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The output is git-ignored and the build must keep the committed .gitkeep.
      - run: |
          pnpm build
          git status --porcelain -- ../internal/web/dist
          test -z "$(git status --porcelain -- ../internal/web/dist)"
      # The committed client must match api/: run `just web-gen` after changing the proto.
      - run: |
          pnpm gen
          git status --porcelain -- src/gen
          test -z "$(git status --porcelain -- src/gen)"
      - run: pnpm exec playwright install --with-deps chromium
      # Against `vite preview` of a production build that serves the fake daemon.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore

  build:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v2
      - run: just build ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: lotsman-linux-${{ matrix.arch }}
          path: dist/lotsman-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum lotsman-linux-* > SHA256SUMS
      # Release notes are the matching section of CHANGELOG.md.
      - run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
